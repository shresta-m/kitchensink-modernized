spring:
  application:
    name: kitchensink
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/kitchensink}
  data:
    mongodb:
      auto-index-creation: true # creates the unique email index and search indexes on startup
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true # rejects unexpected fields (e.g. a client-sent "id")
  web:
    error:
      include-stacktrace: never
      include-binding-errors: never
      include-message: never

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /readiness
      show-details: when-authorized
      roles: ADMIN
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    root: INFO
    com.kitchensink: INFO

springdoc:
  api-docs:
    enabled: ${DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${DOCS_ENABLED:true}

app:
  security:
    jwt-secret: ${JWT_SECRET:demo-only-jwt-secret-PQHtCBWVBpYTbtwYObj-CH_R}   # required, 32+ chars; never commit a value
    jwt-issuer: kitchensink
    jwt-ttl: 30m
    docs-public: true
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    auth-requests-per-minute: 10   # per client address, separately for login and sign-up (429 above this)
    admin-signup-code: ${ADMIN_SIGNUP_CODE:PQHtCBWVBpYTbtwYObj-CH_R}   # blank = public admin sign-up page disabled; otherwise 16+ chars, set via env
  bulk-import:
    batch-size: 500   # rows per Mongo bulk write
    parallelism: 4    # concurrent batches (bounded worker pool)
    max-rows: 5000
    max-errors: 500

