spring.application.name=member-service
server.port=8080

#Timeouts so a dead database fails a request in seconds instead of hanging it for the 30 second driver default; pool capped.
spring.mongodb.uri=mongodb://localhost:27017/kitchensink?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000&socketTimeoutMS=30000&maxPoolSize=50
#true lets the app create the indexes at startup (development). In production set AUTO_INDEX=false and run scripts/mongo/setup.js with an admin account instead, so the app user needs no createIndex right.
spring.data.mongodb.auto-index-creation=${AUTO_INDEX:true}
#Code that grants ADMIN at registration. Set via environment variable; empty means nobody can self-register as admin.
app.admin-code=${ADMIN_CODE:ABCD-1234-EFGH}
#JWT signing secret: at least 32 characters, from the environment. The application refuses to start without it.
app.jwt.secret=${JWT_SECRET:SkySecretKeyForJWTSigningThatIsAtLeast32CharactersLong}
app.jwt.ttl=30m
#Brute-force limits. Failed logins per email lock that email; failed logins per address lock the address (higher limit: offices share addresses).
#A correct login clears the email's failures. Wrong admin codes at registration use the per-email budget, keyed by client address.
app.security.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.security.login.window=${LOGIN_WINDOW:15m}
app.security.login.lockout=${LOGIN_LOCKOUT:15m}
app.security.ip.max-failures=${IP_MAX_FAILURES:50}
#Browser origins allowed to call the API (comma separated)
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

#Client address for the per-address lockout and the API log line. Behind a reverse proxy or load balancer set FORWARD_HEADERS=native,
#otherwise every client looks like the proxy. Leave it at none when the app is reached directly (a spoofed X-Forwarded-For is then ignored).
server.forward-headers-strategy=${FORWARD_HEADERS:none}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

#Health and observability. Only health is exposed, and without details (no database host or version leaks).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include[0]=readinessState
management.endpoint.health.group.readiness.include[1]=mongo
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
#Every log line shows [service,traceId,spanId], so logs can be matched to a trace
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
